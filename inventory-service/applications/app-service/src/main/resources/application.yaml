server:
  port: 8081
spring:
  application:
    name: "InventoryService"
  devtools:
    add-properties: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:mysql://localhost:3307/inventory-db"
    username: "root"
    password: "root"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.MySQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
