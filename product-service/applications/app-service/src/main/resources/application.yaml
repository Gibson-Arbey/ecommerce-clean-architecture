server:
  port: 8080
spring:
  application:
    name: "ProductService"
  devtools:
    add-properties: false
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      auto-index-creation: false
  mongodb:
    uri: "mongodb://root:password@localhost:27018/product-db?authSource=admin"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
